# Docker Compose Configuration for MySQL + Qdrant Architecture
#
# This configuration provides:
# - MySQL: Structured data storage (shared with Backend)
# - Qdrant: High-performance vector database (Mac-friendly)
#
# Qdrant advantages over Milvus:
# - Native ARM64 support (better for Apple Silicon Macs)
# - Lighter weight (no etcd/MinIO dependencies)
# - Easier to deploy and manage
# - Excellent performance and reliability

version: '3.8'

services:
  # MySQL Database (shared with Backend Service)
  mysql:
    image: mysql:8.0
    container_name: synapsetest-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-synapsetest}
      MYSQL_USER: ${MYSQL_USER:-synapsetest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-synapsetest123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - synapsetest-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database (Mac-friendly)
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: synapsetest-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - synapsetest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: synapsetest-ai-service
    ports:
      - "8001:8000"
    environment:
      # Database configuration
      DATABASE_TYPE: mysql
      MYSQL_URI: mysql://synapsetest:synapsetest123@mysql:3306/synapsetest
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: synapsetest
      MYSQL_PASSWORD: synapsetest123
      MYSQL_DATABASE: synapsetest
      
      # Vector database configuration (Qdrant)
      VECTOR_DB_TYPE: qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      QDRANT_MODE: server
      
      # LLM configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_BASE: ${LLM_API_BASE}
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - synapsetest-network
    restart: unless-stopped

  # Backend Service (Java/Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapsetest-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/synapsetest
      SPRING_DATASOURCE_USERNAME: synapsetest
      SPRING_DATASOURCE_PASSWORD: synapsetest123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - synapsetest-network
    restart: unless-stopped

  # Redis (Optional, for caching)
  redis:
    image: redis:7-alpine
    container_name: synapsetest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - synapsetest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  qdrant_data:
    driver: local
  qdrant_snapshots:
    driver: local
  redis_data:
    driver: local

networks:
  synapsetest-network:
    driver: bridge

