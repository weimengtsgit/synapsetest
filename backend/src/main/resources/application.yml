spring:
  application:
    name: test-management-backend
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/synapsetest?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:synapsetest123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
#    mongodb:
#      uri: mongodb://localhost:27017/test_management_ai
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-management-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  autoconfigure:
    exclude:
      # Temporarily disable non-essential services for MVP development
      # MongoDB temporarily enabled to show Monitoring and Report APIs in Swagger
      # - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      # - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      # Disable JPA/Hibernate auto-configuration (using MyBatis instead)
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.synapsetest.testmanagement.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

server:
  port: 8081
  # No context-path - API versioning is handled in Controllers

# Springdoc OpenAPI (Swagger) Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    show-extensions: true
    show-common-extensions: true
    try-it-out-enabled: true
  show-actuator: true
  paths-to-match:
    - /api/**
  packages-to-scan:
    - com.synapsetest.testmanagement.controller

# API Version
api:
  version: 1.0.0

# AI Service Integration Configuration
services:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout:
      connect: 300000  # 300 seconds
      read: 300000    # 300 seconds
    base-path: /api/v1/ai

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.synapsetest: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

# Resilience4j configuration
resilience4j:
  circuitbreaker:
    instances:
      aiService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 50
  retry:
    instances:
      aiService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
cors:
  allowed-origins:
    - http://localhost:3000
    - http://10.56.62.204:3000
    - http://127.0.0.1:3000