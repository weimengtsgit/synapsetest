# 日志配置文件 (用于 Uvicorn)
# 使用方法: uvicorn main:app --log-config logging_config.yaml

version: 1
disable_existing_loggers: False

formatters:
  default:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  access:
    format: '%(asctime)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    formatter: default
    filename: logs/ai-service.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  access_file:
    class: logging.handlers.RotatingFileHandler
    formatter: access
    filename: logs/access.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  # 应用日志
  api:
    level: INFO
    handlers: [console, file]
    propagate: no

  services:
    level: INFO
    handlers: [console, file]
    propagate: no

  models:
    level: INFO
    handlers: [console, file]
    propagate: no

  # Uvicorn 日志
  uvicorn:
    level: INFO
    handlers: [console, file]
    propagate: no

  uvicorn.access:
    level: INFO
    handlers: [console, access_file]
    propagate: no

  uvicorn.error:
    level: INFO
    handlers: [console, file]
    propagate: no

root:
  level: INFO
  handlers: [console, file]
