version: '3.8'

services:
  postgresql:
    image: postgres:13
    environment:
      POSTGRES_DB: test_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - test-management-network

  mongodb:
    image: mongo:5
    environment:
      MONGO_INITDB_DATABASE: test_management_ai
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - test-management-network

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - test-management-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - test-management-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - test-management-network

  rabbitmq:
    image: rabbitmq:3.8-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - test-management-network

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgresql
      - mongodb
      - redis
      - kafka
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/test_management
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/test_management_ai
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_RABBITMQ_HOST: rabbitmq
    networks:
      - test-management-network

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    environment:
      MONGODB_URI: mongodb://mongodb:27017/test_management_ai
      REDIS_HOST: redis
    networks:
      - test-management-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - test-management-network

volumes:
  postgres-data:
  mongo-data:
  redis-data:

networks:
  test-management-network:
    driver: bridge
