# Docker Compose Configuration for MySQL + Milvus Architecture
#
# This configuration provides:
# - MySQL: Structured data storage (shared with Backend)
# - Milvus: Enterprise-grade vector database
# - etcd: Milvus metadata storage
# - MinIO: Milvus object storage

version: '3.8'

services:
  # MySQL Database (shared with Backend Service)
  mysql:
    image: mysql:8.0
    container_name: synapsetest-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-synapsetest}
      MYSQL_USER: ${MYSQL_USER:-synapsetest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-synapsetest123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - synapsetest-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # etcd (Milvus metadata storage)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: synapsetest-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - synapsetest-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO (Milvus object storage)
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: synapsetest-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - synapsetest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus Standalone (Enterprise vector database)
  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: synapsetest-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      - etcd
      - minio
    networks:
      - synapsetest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: synapsetest-ai-service
    ports:
      - "8001:8000"
    environment:
      # Database configuration
      DATABASE_TYPE: mysql
      MYSQL_URI: mysql://synapsetest:synapsetest123@mysql:3306/synapsetest
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: synapsetest
      MYSQL_PASSWORD: synapsetest123
      MYSQL_DATABASE: synapsetest
      
      # Vector database configuration
      VECTOR_DB_TYPE: milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      
      # LLM configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_BASE: ${LLM_API_BASE}
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - synapsetest-network
    restart: unless-stopped

  # Backend Service (Java/Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapsetest-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/synapsetest
      SPRING_DATASOURCE_USERNAME: synapsetest
      SPRING_DATASOURCE_PASSWORD: synapsetest123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - synapsetest-network
    restart: unless-stopped

  # Redis (Optional, for caching)
  redis:
    image: redis:7-alpine
    container_name: synapsetest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - synapsetest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  milvus_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  synapsetest-network:
    driver: bridge

